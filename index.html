<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16191d" media="(prefers-color-scheme: dark)" />
    <title>Anachena — Inventario</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f5f7;
        transition: opacity 320ms ease;
      }

      #splash img {
        width: 200px;
        max-width: 58vw;
        height: auto;
      }

      @media (min-width: 720px) {
        #splash img { width: 380px; }
      }

      @keyframes splash-in {
        from {
          opacity: 0;
          transform: scale(0.985);
        }
      }

      #splash img.cargada {
        animation: splash-in 520ms ease-out;
      }

      #splash.splash-out {
        opacity: 0;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #splash { transition: none; }
        #splash img.cargada { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img
        src="/brand/logo-completo.png"
        alt="Anachena"
        onload="this.classList.add('cargada')"
      />
    </div>
    <div id="root"></div>
    <script>
      window.__splashStart = Date.now()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
